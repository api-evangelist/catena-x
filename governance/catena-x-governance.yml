- >-
  No named individuals anywhere on the public surface. The association publishes 10 committees
  and 30 expert groups with their remits, and does not publish who chairs them or who sits on
  them. The people layer this pipeline exists to capture is genuinely absent — recorded as a
  miss, not guessed at.
- >-
  Member companies are published as a PDF list with no URLs, no seats and no roles, so the
  coalition graph carries participation but no governance weight.
