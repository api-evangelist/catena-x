name: Catena-X
description: 'Catena-X is the automotive industry''s data space standard, published by Catena-X Automotive
  Network e.V. — a non-commercial German registered association founded on 15 May 2021 by BMW, Mercedes-Benz,
  Volkswagen, Bosch, SAP, Siemens, Schaeffler, ZF, BASF, Henkel, Deutsche Telekom and Fraunhofer, with
  backing from the German Federal Ministry for Economic Affairs and Climate Action. It publishes a numbered
  CX-xxxx library of 77 standards covering how a supply chain exchanges part data, carbon footprints,
  quality records, demand and capacity signals and digital product passports without any participant surrendering
  its data to a central platform. Standards move forward together in named releases — Jupiter, Io, Saturn,
  Titan — gated by a Technical Committee for Standardization, and conformance is certified by nominated
  third-party assessment bodies including TÜV Rheinland and TÜV SÜD. The reference implementation is open
  source as Eclipse Tractus-X, and the network is operated commercially by Cofinity-X. It is the most
  institutionally complete industry API standard in Europe, and the one whose endpoints an outside developer
  can never call: in a data space every participant runs its own connector and registry, so there is nothing
  to call until you are onboarded, credentialed and certified.'
